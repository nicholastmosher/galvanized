[workspace]
resolver = "3"
members = [
    "crates/app-galvanized",
    "crates/plugin-automerge",
    "crates/plugin-calendar",
    "crates/plugin-chat",
    "crates/plugin-contacts",
    "crates/plugin-files",
    "crates/plugin-galvanized",
    "crates/plugin-p2p",
    "crates/plugin-theme-palette",
    "crates/plugin-vault",
    "crates/plugin-willow",
    "crates/strict-cap",
]
exclude = [
    "crates/unused_iroh-automerge"
]

[workspace.dependencies]
aes-gcm-siv = { version = "0.11", features = ["std"] }
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
automerge = "0.8"
autosurgeon = { version = "0.11.0", features = ["uuid"] }
base64 = "0.22.1"
bytes = "1.11.0"
capsec = "0.2.2"
capsec-core = "0.2.2"
chrono = { version = "0.4.45", features = ["serde"] }
crypto-common = "0.1"
culpa = "1.0.2"
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6.1.0"
data-encoding = "2.10.0"
derive_more = { version = "2.1.0", features = ["full"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
flume = "0.12.0"
futures = "0.3.32"
futures-concurrency = "7.7.1"
hex = "0.4.3"
image = "0.24.9"
iroh = { git = "https://github.com/nicholastmosher/iroh", branch = "galvanized" }
iroh-ping = "1.0.0"
# iroh-blobs = "0.98.0"
# iroh-docs = "0.96.0"
# iroh-gossip = "0.96.0"
libp2p = { version = "0.54.1", features = ["full"] }
libp2p-stream = "0.2.0-alpha"
libp2p-swarm = "0.45"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = "0.31.0"
plot_icon = "0.3.0"
quote = "1.0.44"
rand = "0.9.2"
rand_0_8_5 = { package = "rand", version = "0.8.5" }
rand_core = "0.9.2"
rand_core_0_6_4 = { package = "rand_core", version = "0.6.4" }
rust-embed = "8.11.0"
schemars = "1.2.1"
samod = { version = "0.9.0", features = ["tokio"] }
# samod = { path = "../samod/samod", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_with = "3.21.0"
signature = "2.2.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "uuid"] }
syn = "2.0.116"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt"] }
tokio-util = "0.7.17"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing = "0.1.43"
tracing-loki = "0.2.6"
tracing-opentelemetry = { version = "0.32.1" }
ufotofu = { version = "0.12.4", features = ["compat_futures_io"] }
uuid = "1.23.1"
# willow25 = { git = "https://codeberg.org/worm-blossom/willow_rs.git", rev = "5b4eb0f31942535f9c163dd8ae884d82508cc1fe" }
willow25 = "0.5.0"
zeroize = { version = "1.8.2", features = ["std", "zeroize_derive"] }

# If you run into build errors, make sure this is using the git dep, not path
# I sometimes switch it to path dep when tweaking Zed itself
# gpui = { package = "gpui", git = "https://github.com/nicholastmosher/zed", branch = "first-class-plugins", features = ["test-support"] }
# zed = { git = "https://github.com/nicholastmosher/zed", branch = "first-class-plugins" }
# zed = { git = "https://github.com/nicholastmosher/zed", branch = "galvanized" }
zed = { path = "../zed/crates/zed" }

# Path dependencies
# csh-demo = { path = "crates/csh-demo" }
plugin-automerge = { path = "crates/plugin-automerge" }
plugin-calendar = { path = "crates/plugin-calendar" }
plugin-chat = { path = "crates/plugin-chat" }
plugin-contacts = { path = "crates/plugin-contacts" }
plugin-files = { path = "crates/plugin-files" }
plugin-galvanized = { path = "crates/plugin-galvanized" }
plugin-p2p = { path = "crates/plugin-p2p" }
plugin-theme-palette = { path = "crates/plugin-theme-palette" }
plugin-vault = { path = "crates/plugin-vault" }
plugin-willow = { path = "crates/plugin-willow" }
strict-cap = { path = "crates/strict-cap" }

# iroh-automerge = { path = "crates/iroh-automerge" }
# iroh-automerge = { path = "../../../../n0-computer/iroh-examples/iroh-automerge" }
# iroh-automerge-repo = { path = "../../../../n0-computer/iroh-examples/iroh-automerge-repo" }
# willow25 = { path = "../../../codeberg.org/worm-blossom/willow_rs/willow25" }
# willow-api-derive = { path = "crates/willow-api-derive" }
# zed = { path = "../../../zed/crates/zed" }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop" }
livekit = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "d0e27be0cdad89eadab3e36207cda0a2b6e359ee" }
libwebrtc = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "d0e27be0cdad89eadab3e36207cda0a2b6e359ee" }
notify = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
webrtc-sys = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "d0e27be0cdad89eadab3e36207cda0a2b6e359ee" }
